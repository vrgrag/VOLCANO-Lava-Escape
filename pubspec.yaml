name: lava_escape
description: "Lava Escape — dodge magma waves and clear the crumbling volcano before it swallows the isle."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # White (native) part — already used by the offline game.
  shared_preferences: ^2.5.2

  # Gray-part stack. Versions are intentionally distinct from every other
  # project shipped from this developer — do not sync them "just to unify".
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.11.0
  connectivity_plus: ^6.1.4
  appsflyer_sdk: ^6.17.1
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.10
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.4
  device_info_plus: ^11.2.0
  http: ^1.5.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

# Launcher icon.
# `icon2.png` is a full-bleed scene — using it directly as the adaptive
# foreground made every launcher mask (Pixel circle, Samsung squircle,
# OneUI teardrop) chop the coins off the corners.
# `icon2_foreground.png` is pre-rendered at 1024×1024 with the artwork
# scaled to the ~66% safe zone on a transparent canvas, so the mask can
# only ever clip transparency. Keep the flat `icon2.png` as the legacy
# square icon for pre-Oreo devices and the Play Store listing.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon2.png"
  adaptive_icon_background: "#0D0806"
  adaptive_icon_foreground: "assets/icon2_foreground.png"
  min_sdk_android: 30
  remove_alpha_ios: false
