org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation — required on Windows whenever
# the project path (D:) and the pub cache (C:) live on different drives,
# and any time the path contains a space or non-ASCII character (pitfalls §6).
kotlin.incremental=false
